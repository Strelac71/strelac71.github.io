<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Punjač Lidl Zemun</title>
    <style>
        /* Sigurni unutrašnji CSS stilovi koji daju identičan dizajn sa slike i nikada ne pucaju */
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .kontejner { width: 100%; max-width: 448px; margin-top: 16px; box-sizing: border-box; }
        .gornji-status { text-align: center; margin-bottom: 24px; }
        .gornji-status p { color: #64748b; font-size: 14px; font-weight: 500; margin: 0; text-transform: uppercase; letter-spacing: 0.5px; }
        .online-bedz { display: inline-flex; align-items: center; justify-content: center; background-color: #e6f7ed; color: #10b981; font-weight: 700; padding: 4px 16px; border-radius: 9999px; font-size: 12px; margin-top: 8px; border: 1px solid #d1fae5; }
        .kartica { background-color: white; border: 2px solid #10b981; border-radius: 24px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 16px; position: relative; box-sizing: border-box; transition: all 0.3s ease; }
        .kartica.zauzeta { border-color: #fca5a5; }
        .status-bedz { position: absolute; top: 24px; right: 24px; padding: 4px 12px; font-size: 12px; font-weight: 700; border-radius: 9999px; }
        .status-slobodan { background-color: #e6f7ed; color: #10b981; border: 1px solid #d1fae5; }
        .status-zauzet { background-color: #fee2e2; color: #ef4444; border: 1px solid #fecaca; }
        .info-naziv { font-size: 20px; font-weight: 800; color: #1e293b; margin: 0 0 8px 0; padding-right: 60px; }
        .info-lokacija { font-size: 14px; color: #64748b; margin: 0 0 12px 0; font-weight: 500; display: flex; align-items: center; gap: 4px; }
        .info-snaga { display: inline-flex; align-items: center; padding: 4px 10px; font-size: 12px; font-weight: 700; background-color: #e6f7ed; color: #10b981; border: 1px solid #d1fae5; border-radius: 8px; }
        .labela { display: block; font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .input-polje { width: 100%; padding: 10px 16px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; font-weight: 600; color: #334155; box-sizing: border-box; transition: all 0.2s; }
        .input-polje:focus { outline: none; border-color: #10b981; background-color: white; }
        .korisnik-box { border: 1px solid #fee2e2; border-radius: 16px; padding: 16px; background-color: #fee2e2; background-opacity: 0.4; display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .profil-avatar { width: 48px; height: 48px; background-color: #fecaca; border-radius: 9999px; display: flex; align-items: center; justify-content: center; color: #ef4444; font-size: 20px; }
        .korisnik-ime-tekst { font-size: 18px; font-weight: 900; color: #1e293b; margin: 0; }
        .korisnik-status-tekst { font-size: 12px; color: #64748b; margin: 2px 0 0 0; font-weight: 500; }
        .dugme { width: 100%; padding: 14px; color: white; font-weight: 700; border-radius: 16px; border: none; font-size: 16px; cursor: pointer; transition: all 0.15s; font-family: inherit; }
        .dugme-zeleno { background-color: #10b981; margin-top: 20px; }
        .dugme-sivo { background-color: #6b7280; margin-top: 20px; }
        .dugme-plavo { background-color: #3b82f6; }
        .lista-kartica { background-color: white; border: 1px solid #f1f5f9; border-radius: 24px; padding: 20px; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05); margin-bottom: 20px; box-sizing: border-box; }
        .lista-zaglavlje { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .lista-naslov { font-size: 16px; font-weight: 800; color: #334155; margin: 0; display: flex; align-items: center; gap: 8px; }
        .lista-brojac { background-color: #eff6ff; color: #2563eb; font-weight: 900; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; font-size: 12px; border: 1px solid #dbeafe; }
        .lista-kontejner { margin-bottom: 16px; max-height: 160px; overflow-y: auto; }
        .prazan-red-tekst { text-align: center; color: #94a3b8; padding: 16px 0; font-size: 14px; font-weight: 500; margin: 0; }
        .red-red { display: flex; justify-content: space-between; align-items: center; background-color: #f8fafc; border: 1px solid #f1f5f9; padding: 10px; border-radius: 12px; font-size: 14px; font-weight: 700; color: #475569; margin-top: 8px; }
        .obrisi-btn { background: none; border: none; color: #ef4444; font-size: 12px; font-weight: 600; cursor: pointer; }
        .obrisi-btn:hover { text-decoration: underline; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Glavni kontejner aplikacije -->
    <div class="kontejner">
        
        <!-- Gornji Online Status -->
        <div class="gornji-status">
            <p>Lidl Zemun</p>
            <div class="online-bedz">✓ Online</div>
        </div>

        <!-- GLAVNA KARTICA PUNJAČA -->
        <div id="glavna-kartica" class="kartica">
          
          <!-- STATUS BADGE -->
          <div id="status-tekst" class="status-bedz status-slobodan">Slobodan</div>

          <!-- INFORMACIJE O PUNJAČU -->
          <div>
            <h2 class="info-naziv">EV Punjač Lidl Zemun</h2>
            <p class="info-lokacija">📍 Dunavskih virova 38, Zemun</p>
            <div class="info-snaga">🧃 20kW DC</div>
          </div>

          <!-- Polje za unos imena -->
          <div id="ime-kontejner" style="margin-top: 20px;">
              <label class="labela">Ukucaj svoje ime iz Viber grupe:</label>
              <input id="korisnik-ime" type="text" placeholder="Npr. Goran, Nikola, Dejan..." class="input-polje">
          </div>

          <!-- BOX SA IMENOM VOZAČA -->
          <div id="trenutni-korisnik-box" class="hidden" style="margin-top: 20px;">
              <div class="korisnik-box">
                  <div style="display: flex; align-items: center; gap: 12px;">
                      <div class="profil-avatar">👤</div>
                      <div>
                          <h4 id="prikaz-ime" class="korisnik-ime-tekst">-</h4>
                          <p class="korisnik-status-tekst">Trenutno puni</p>
                      </div>
                  </div>
              </div>
          </div>

          <!-- GLAVNO DUGME KARTICE -->
          <button id="check-in-btn" class="dugme dugme-zeleno">Check-in</button>

        </div>

        <!-- LISTA ČEKANJA KARTICA -->
        <div class="lista-kartica">
            <div class="lista-zaglavlje">
                <h3 class="lista-naslov">📋 Lista čekanja</h3>
                <span id="queueCounter" class="lista-brojac">0</span>
            </div>
            
            <!-- Spisak ljudi u redu -->
            <div id="lista-ljudi" class="lista-kontejner">
                <p id="queueStatus" class="prazan-red-tekst">Nema ljudi u redu</p>
            </div>

            <!-- DUGME ZA PRIDRUŽIVANJE REDU -->
            <button id="red-dugme" class="dugme dugme-plavo">+ Pridruži se redu</button>
        </div>

    </div>

    <!-- Internet veza sa Firebase bazom podataka -->
    <script type="module">
      import { initializeApp } from "https://gstatic.com";
      import { getDatabase, ref, set, onValue, push, remove } from "https://gstatic.com";

      const firebaseConfig = {
        apiKey: "AIzaSyDi3jmhCordBvkXMLDf8",
        authDomain: "://firebaseapp.com",
        databaseURL: "https://firebasedatabase.app",
        projectId: "lidl-punjac",
        storageBucket: "://appspot.com",
        messagingSenderId: "97822670918",
        appId: "1:97822670918:web:3f4ea8083"
      };

      const app = initializeApp(firebaseConfig);
      const database = getDatabase(app);
      
      const statusRef = ref(database, 'punjac_zemun/status');
      const redRef = ref(database, 'punjac_zemun/red');

      const glavnaKartica = document.getElementById("glavna-kartica");
      const statusBadge = document.getElementById("status-tekst");
      const checkInBtn = document.getElementById("check-in-btn");
      const redDugme = document.getElementById("red-dugme");
      const imeKontejner = document.getElementById("ime-kontejner");
      const korisnikImeInput = document.getElementById("korisnik-ime");
      const trenutniKorisnikBox = document.getElementById("trenutni-korisnik-box");
      const prikazIme = document.getElementById("prikaz-ime");
      const queueCounter = document.getElementById("queueCounter");
      const listaLjudiContainer = document.getElementById("lista-ljudi");

      let trenutnoZauzet = false;

      // 1. Uživo menjanje statusa Slobodan / Zauzet
      onValue(statusRef, (snapshot) => {
        const podaci = snapshot.val();
        
        if (podaci && podaci.stanje === 'zauzet') {
          trenutnoZauzet = true;
          
          statusBadge.innerText = "Zauzet";
          statusBadge.className = "status-bedz status-zauzet";
          glavnaKartica.className = "kartica zauzeta";
          
          imeKontejner.classList.add("hidden");
          trenutniKorisnikBox.classList.remove("hidden");
          prikazIme.innerText = podaci.koPuni;
          
          checkInBtn.innerText = "Check-out (Oslobodi punjač)";
          checkInBtn.className = "dugme dugme-sivo";
        } else {
          trenutnoZauzet = false;
          
          statusBadge.innerText = "Slobodan";
        statusBadge.className = "status-bedz status-slobodan";
glavnaKartica.className = "kartica";
imeKontejner.classList.remove("hidden");
trenutniKorisnikBox.classList.add("hidden");
checkInBtn.innerText = "Check-in";
checkInBtn.className = "dugme dugme-zeleno";
}
});
// 2. Uživo osvežavanje liste čekanja
onValue(redRef, (snapshot) => {
listaLjudiContainer.innerHTML = "";
let listaCekanjaLokalno = [];
const podaci = snapshot.val();
if (podaci) {
Object.keys(podaci).forEach(kljuc => {
listaCekanjaLokalno.push({
id: kljuc,
ime: podaci[kljuc].ime,
vreme: podaci[kljuc].vreme
});
});
listaCekanjaLokalno.sort((a, b) => a.vreme - b.vreme);
queueCounter.innerText = listaCekanjaLokalno.length;
listaCekanjaLokalno.forEach((korisnik, indeks) => {
const osobaRow = document.createElement("div");
osobaRow.className = "red-red";
osobaRow.innerHTML = <div style="display: flex; align-items: center; gap: 8px;"> <span style="color: #3b82f6;">${indeks + 1}.</span> <span>👤 ${korisnik.ime}</span> </div> <button class="obrisi-btn" data-id="${korisnik.id}">Ukloni</button>;
listaLjudiContainer.appendChild(osobaRow);
});
listaLjudiContainer.querySelectorAll(".obrisi-btn").forEach(btn => {
btn.addEventListener("click", (e) => {
const idZaBrisanje = e.target.getAttribute("data-id");
remove(ref(database, punjac_zemun/red/${idZaBrisanje}));
});
});
} else {
queueCounter.innerText = "0";
listaLjudiContainer.innerHTML = 'Nema ljudi u redu';
}
});
// 3. Klik za "Check-in / Check-out"
checkInBtn.addEventListener('click', () => {
const unesenoIme = korisnikImeInput.value.trim();
if (!trenutnoZauzet) {
if (!unesenoIme) {
alert("Molimo te ukucaj svoje ime iz Viber grupe pre nego što pritisneš Check-in!");
return;
}
set(statusRef, {
stanje: 'zauzet',
koPuni: unesenoIme,
vremePocetka: Date.now()
});
korisnikImeInput.value = "";
} else {
set(statusRef, {
stanje: 'slobodan',
koPuni: ''
});
}
});
// 4. Klik na "+ Pridruži se redu"
redDugme.addEventListener('click', () => {
const imeZaRed = prompt("Ukucaj svoje ime iz Viber grupe da staneš u red čekanja:");
if (imeZaRed && imeZaRed.trim() !== "") {
push(redRef, {
ime: imeZaRed.trim(),
vreme: Date.now()
});
}
});
