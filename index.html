<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Punjači - Lidl Zemun</title>
    <!-- Univerzalni Tailwind CSS v3 koji dokazano radi na tvom telefonu -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col items-center p-4">

    <!-- Glavni kontejner aplikacije -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-sm p-6 mt-6 border border-gray-100">
        
        <!-- Zaglavlje sa munjom i naslovom -->
        <div class="text-center mb-6">
            <div class="text-amber-400 text-4xl mb-2">⚡</div>
            <h1 class="text-3xl font-bold text-gray-800 tracking-tight">EV Punjači</h1>
            <p class="text-gray-500 text-lg mt-1">Lidl Zemun</p>
            
            <!-- Online status gornjeg dela aplikacije -->
            <div class="inline-flex items-center justify-center bg-emerald-50 text-emerald-600 font-medium px-4 py-1 rounded-full text-sm mt-3 border border-emerald-100">
                <span class="mr-1.5 text-xs">✓</span> Online
            </div>
        </div>

        <!-- GLAVNA KARTICA PUNJAČA -->
        <div class="relative bg-white border border-emerald-200 rounded-2xl p-6 shadow-sm mb-6">
          
          <!-- STATUS BADGE (Gore desno) -->
          <div id="status-tekst" class="absolute top-5 right-5 px-3 py-1 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-600 border border-emerald-200">
            Slobodan
          </div>

          <!-- INFORMACIJE O PUNJAČU -->
          <div class="space-y-2">
            <h3 class="text-xl font-bold text-gray-800 pr-20">EV Punjač Lidl Zemun</h3>
            <p class="text-sm text-gray-500 flex items-center gap-1">
              📍 Dunavskih virova 38, Zemun
            </p>
            <div class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-700 border border-blue-100">
              ⚡ 20kW DC
            </div>
          </div>

          <!-- Polje za unos imena iz Viber grupe -->
          <div id="ime-kontejner" class="mt-4">
              <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Ukucaj svoje ime iz Viber grupe:</label>
              <input id="korisnik-ime" type="text" placeholder="Npr. Goran, Nikola, Dejan..." 
                     class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm font-semibold text-gray-700 focus:outline-none focus:border-blue-400 focus:bg-white transition">
          </div>

          <!-- KORISNIK BOX (Prikazuje se samo kada je ZAUZETO) -->
          <div id="trenutni-korisnik-box" class="hidden border border-red-100 rounded-2xl p-4 bg-red-50 flex items-center justify-between mt-4">
              <div class="flex items-center gap-3">
                  <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center text-red-500 text-xl font-bold shadow">
                      👤
                  </div>
                  <div>
                      <h4 id="prikaz-ime" class="font-black text-gray-800 text-lg leading-tight">Goran</h4>
                      <p class="text-xs text-gray-500 font-medium mt-0.5">Punjač zauzet</p>
                  </div>
              </div>
              <div class="text-right">
                  <div id="prikaz-tajmer" class="text-xl font-black text-red-500 tracking-tight">180 min</div>
                  <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">preostalo</p>
              </div>
          </div>

          <!-- DUGME ZA CHECK-IN -->
          <div class="mt-5">
            <button id="check-in-btn" class="w-full py-3 text-white font-medium rounded-xl bg-emerald-500 hover:bg-emerald-600 transition duration-200 shadow-md">
              Check-in
            </button>
          </div>

        </div>

        <!-- Lista čekanja -->
        <div class="border border-gray-100 rounded-2xl p-5 bg-gray-50">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center text-gray-700 font-bold text-lg">
                    📋 Lista čekanja
                </div>
                <!-- Brojač ljudi u redu -->
                <span id="queueCounter" class="bg-blue-50 text-blue-600 font-bold w-7 h-7 flex items-center justify-center rounded-full text-sm border border-blue-100">
                    0
                </span>
            </div>
            
            <!-- Status reda -->
            <p id="queueStatus" class="text-center text-gray-400 py-4 font-medium">Nema ljudi u redu</p>
        </div>

    </div>

    <!-- Firebase Realtime logika sparena sa tvojim dugmetom -->
    <script type="module">
      import { initializeApp } from "https://gstatic.com";
      import { getDatabase, ref, set, onValue } from "https://gstatic.com";

      // Konfiguracija tvoje Firebase baze
      const firebaseConfig = {
        apiKey: "AIzaSyDi3jmhCordBvkXMLDf8",
        authDomain: "://firebaseapp.com",
        databaseURL: "https://firebasedatabase.app",
        projectId: "lidl-punjac",
        storageBucket: "://appspot.com",
        messagingSenderId: "97822670918",
        appId: "1:97822670918:web:3f4ea8083"
      };

      const app = initializeApp(firebaseConfig);
      const database = getDatabase(app);
      const statusRef = ref(database, 'punjac_zemun/status');

      const statusBadge = document.getElementById("status-tekst");
      const checkInBtn = document.getElementById("check-in-btn");
      const imeKontejner = document.getElementById("ime-kontejner");
      const trenutniKorisnikBox = document.getElementById("trenutni-korisnik-box");
      const prikazIme = document.getElementById("prikaz-ime");
      const korisnikImeInput = document.getElementById("korisnik-ime");

      let trenutnoZauzet = false;

      // Slušanje promena u bazi i promena izgleda na ekranu
      onValue(statusRef, (snapshot) => {
        const podaci = snapshot.val();
        
        if (podaci && podaci.stanje === 'zauzet') {
          trenutnoZauzet = true;
          
          statusBadge.innerText = "Zauzet";
          statusBadge.className = "absolute top-5 right-5 px-3 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-600 border border-red-200";
          
          imeKontejner.classList.add("hidden");
          trenutniKorisnikBox.classList.remove("hidden");
          prikazIme.innerText = podaci.koPuni;

          checkInBtn.innerText = "Check-out (Oslobodi punjač)";
          checkInBtn.className = "w-full py-3 text-white font-medium rounded-xl bg-gray-500 hover:bg-gray-600 transition duration-200 shadow-md";
        } else {
          trenutnoZauzet = false;
          
          statusBadge.innerText = "Slobodan";
          statusBadge.className = "absolute top-5 right-5 px-3 py-1 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-600 border border-emerald-200";
          
          imeKontejner.classList.remove("hidden");
          trenutniKorisnikBox.classList.add("hidden");

          checkInBtn.innerText = "Check-in";
          checkInBtn.className = "w-full py-3 text-white font-medium rounded-xl bg-emerald-500 hover:bg-emerald-600 transition duration-200 shadow-md";
        }
      });

      // Slanje novog stanja u Firebase na klik dugmeta
      checkInBtn.addEventListener('click', () => {
        const unesenoIme = korisnikImeInput.value.trim();

        if (!trenutnoZauzet) {
          if (!unesenoIme) {
              alert("Molimo te ukucaj svoje ime iz Viber grupe pre nego što pritisneš Check-in!");
              return;
          }
          set(statusRef, {
              stanje: 'zauzet',
              koPuni: unesenoIme
          });
          korisnikImeInput.value = "";
        } else {
          set(statusRef, {
              stanje: 'slobodan',
              koPuni: ''
          });
        }
      });
    </script>
</body>
</html>
