<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Punjač Lidl Zemun</title>
    <!-- Tailwind CSS za identičan dizajn sa slike -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        .custom-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col items-center p-4">

    <!-- Glavni kontejner aplikacije -->
    <div class="w-full max-w-md mt-2">
        
        <!-- Gornji Online Status -->
        <div class="text-center mb-6">
            <p class="text-gray-500 font-bold text-sm tracking-wide uppercase">Lidl Zemun</p>
            <div class="inline-flex items-center justify-center bg-green-100 text-green-600 font-bold px-4 py-1 rounded-full text-xs mt-2 border border-green-200">
                <span class="mr-1">✓</span> Online
            </div>
        </div>

        <!-- GLAVNA KARTICA PUNJAČA -->
        <div class="bg-white border border-red-200 rounded-3xl p-6 custom-shadow mb-5 relative">
          
          <!-- STATUS BADGE (Gore desno) -->
          <div id="status-tekst" class="absolute top-6 right-6 px-3 py-1 text-xs font-bold rounded-full bg-green-100 text-green-600 border border-green-200">
            Slobodan
          </div>

          <!-- INFORMACIJE O PUNJAČU -->
          <div class="space-y-2 mb-5">
            <h2 class="text-xl font-extrabold text-gray-800 pr-20">EV Punjač Lidl Zemun</h2>
            <p class="text-sm text-gray-500 flex items-center gap-1 font-medium">
              <span class="text-red-500">📍</span> Dunavskih virova 38, Zemun
            </p>
            <div class="inline-flex items-center px-2 py-0.5 rounded-lg text-xs font-bold bg-green-50 text-green-700 border border-green-100">
              🔋 20kW DC
            </div>
          </div>

          <!-- Polje za unos imena (Prikazuje se samo kad je slobodan) -->
          <div id="ime-kontejner" class="mb-2">
              <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Ukucaj svoje ime iz Viber grupe:</label>
              <input id="korisnik-ime" type="text" placeholder="Npr. Goran, Nikola, Dejan..." 
                     class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-sm font-bold text-gray-700 focus:outline-none focus:border-blue-400 focus:bg-white transition duration-200">
          </div>

          <!-- KORISNIK BOX (Prikazuje se samo kada je ZAUZETO) -->
          <div id="trenutni-korisnik-box" class="hidden border border-red-100 rounded-2xl p-4 bg-red-50 flex items-center justify-between mb-2">
              <div class="flex items-center gap-3">
                  <!-- Ikona profila sa slike -->
                  <div class="w-14 h-12 bg-red-100 rounded-full flex items-center justify-center text-gray-600 text-2xl font-bold shadow-inner">
                      👤
                  </div>
                  <div>
                      <h4 id="prikaz-ime" class="font-black text-gray-800 text-xl leading-tight">Goran</h4>
                      <p class="text-xs text-gray-400 font-bold mt-1">Punjač zauzet</p>
                  </div>
              </div>
              <div class="text-right">
                  <div id="prikaz-tajmer" class="text-2xl font-black text-red-500 tracking-tight">180 min</div>
                  <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">preostalo</p>
              </div>
          </div>

        </div>

        <!-- LISTA ČEKANJA KARTICA -->
        <div class="bg-white border border-gray-100 rounded-3xl p-5 custom-shadow mb-5">
            <div class="flex justify-between items-center mb-5">
                <div class="flex items-center text-gray-700 font-extrabold text-base gap-2">
                    📋 Lista čekanja
                </div>
                <!-- Brojač ljudi u redu -->
                <span id="queueCounter" class="bg-blue-50 text-blue-600 font-black w-8 h-8 flex items-center justify-center rounded-full text-xs border border-blue-100">
                    0
                </span>
            </div>
            
            <!-- Spisak ljudi u redu -->
            <div id="lista-ljudi" class="space-y-2 mb-5 max-h-40 overflow-y-auto">
                <p id="queueStatus" class="text-center text-gray-400 py-4 text-sm font-medium">Nema ljudi u redu</p>
            </div>

            <!-- GLAVNO DUGME -->
            <button id="akciono-dugme" class="w-full py-4 text-white font-bold rounded-2xl bg-green-500 hover:bg-green-600 transition duration-150 shadow-md tracking-wide">
              Check-in (Pokreni punjenje)
            </button>
        </div>

    </div>

    <!-- Povezivanje sa tvojom Firebase bazom -->
    <script type="module">
      import { initializeApp } from "https://gstatic.com";
      import { getDatabase, ref, set, onValue, push, remove } from "https://gstatic.com";

      // Tvoja Firebase konfiguracija (izvlači podatke za Lidl Zemun)
      const firebaseConfig = {
        apiKey: "AIzaSyDi3jmhCordBvkXMLDf8",
        authDomain: "://firebaseapp.com",
        databaseURL: "https://firebasedatabase.app",
        projectId: "lidl-punjac",
        storageBucket: "://appspot.com",
        messagingSenderId: "97822670918",
        appId: "1:97822670918:web:3f4ea8083"
      };

      const app = initializeApp(firebaseConfig);
      const database = getDatabase(app);
      
      // Kreiramo posebne grane u bazi samo za Zemun
      const statusRef = ref(database, 'punjac_zemun/status');
      const redRef = ref(database, 'punjac_zemun/red');

      const statusBadge = document.getElementById("status-tekst");
      const imeKontejner = document.getElementById("ime-kontejner");
      const korisnikImeInput = document.getElementById("korisnik-ime");
      const trenutniKorisnikBox = document.getElementById("trenutni-korisnik-box");
      const prikazIme = document.getElementById("prikaz-ime");
      const prikazTajmer = document.getElementById("prikaz-tajmer");
      const akcionoDugme = document.getElementById("akciono-dugme");
      const queueCounter = document.getElementById("queueCounter");
      const listaLjudiContainer = document.getElementById("lista-ljudi");

      let trenutnoZauzet = false;
      let intervalTajmera = null;

      // Slušanje statusa punjača u Zemunu
      onValue(statusRef, (snapshot) => {
        const podaci = snapshot.val();
        clearInterval(intervalTajmera);
        
        if (podaci && podaci.stanje === 'zauzet') {
          trenutnoZauzet = true;
          
          statusBadge.innerText = "Zauzet";
          statusBadge.className = "absolute top-6 right-6 px-3 py-1 text-xs font-bold rounded-full bg-red-100 text-red-600 border border-red-200";
          
          imeKontejner.classList.add("hidden");
          trenutniKorisnikBox.classList.remove("hidden");
          prikazIme.innerText = podaci.koPuni;
          
          akcionoDugme.innerText = "+ Pridruži se redu";
          akcionoDugme.className = "w-full py-4 text-white font-bold rounded-2xl bg-blue-600 hover:bg-blue-700 transition duration-150 shadow-md tracking-wide";

          const vremePocetka = podaci.vremePocetka;
          const maksMinuta = 180; // Tajmer podešen na 3 sata kao na slici

          function azurirajVreme() {
              const protekloSekundi = Math.floor((Date.now() - vremePocetka) / 1000);
              const protekloMinuta = Math.floor(protekloSekundi / 60);
              const preostaloMinuta = maksMinuta - protekloMinuta;

              if (preostaloMinuta <= 0) {
                  prikazTajmer.innerText = "Isteklo!";
                  clearInterval(intervalTajmera);
              } else {
                  prikazTajmer.innerText = preostaloMinuta + " min";
              }
          }
          azurirajVreme();
          intervalTajmera = setInterval(azurirajVreme, 30000);

        } else {
          trenutnoZauzet = false;
          
          statusBadge.innerText = "Slobodan";
          statusBadge.className = "absolute top-6 right-6 px-3 py-1 text-xs font-bold rounded-full bg-green-100 text-green-600 border border-green-200";
          
          imeKontejner.classList.remove("hidden");
          trenutniKorisnikBox.classList.add("hidden");
          
          akcionoDugme.innerText = "Check-in (Pokreni punjenje)";
          akcionoDugme.className = "w-full py-4 text-white font-bold rounded-2xl bg-green-500 hover:bg-green-600 transition duration-150 shadow-md tracking-wide";
        }
      });

      // Slušanje liste čekanja za Zemun uživo
      onValue(redRef, (snapshot) => {
        listaLjudiContainer.innerHTML = "";
        let listaCekanjaLokalno = [];
        const podaci = snapshot.val();

        if (podaci) {
            Object.keys(podaci).forEach(kljuc => {
                listaCekanjaLokalno.push({
                    id: kljuc,
                    ime: podaci[kljuc].ime,
                    vreme: podaci[kljuc].vreme
                });
            });

            listaCekanjaLokalno.sort((a, b) => a.vreme - b.vreme);
            queueCounter.innerText = listaCekanjaLokalno.length;
            
            listaCekanjaLokalno.forEach((korisnik, indeks) => {
                const osobaRow = document.createElement("div");
                osobaRow.className = "flex justify-between items-center bg-gray-50 border border-gray-100 p-2.5 rounded-xl text-sm font-bold text-gray-700 mt-2";
                osobaRow.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-blue-500">${indeks + 1}.</span>
Use code with caution.👤 ${korisnik.ime}Ukloni`;listaLjudiContainer.appendChild(osobaRow);});listaLjudiContainer.querySelectorAll("button").forEach(btn => {btn.addEventListener("click", (e) => {const idZaBrisanje = e.target.getAttribute("data-id");remove(ref(database, punjac_zemun/red/${idZaBrisanje}));});});} else {queueCounter.innerText = "0";listaLjudiContainer.innerHTML = 'Nema ljudi u redu';}});// Klik na glavno akciono dugmeakcionoDugme.addEventListener('click', () => {const unesenoIme = korisnikImeInput.value.trim();if (!trenutnoZauzet) {if (!unesenoIme) {alert("Ukucaj svoje ime iz Viber grupe pre pokretanja punjenja!");return;}set(statusRef, {stanje: 'zauzet',koPuni: unesenoIme,vremePocetka: Date.now()});korisnikImeInput.value = "";} else {const imeZaRed = prompt("Ukucaj svoje ime iz Viber grupe da staneš u red čekanja:");if (imeZaRed && imeZaRed.trim() !== "") {push(redRef, {ime: imeZaRed.trim(),vreme: Date.now()});}}});
