<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Punjač Lidl Zemun</title>
    <style>
        /* Stabilni CSS stilovi koji drže tvoj dizajn i novi Popup na mestu */
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .kontejner { width: 100%; max-width: 448px; margin-top: 16px; box-sizing: border-box; }
        .gornji-status { text-align: center; margin-bottom: 24px; }
        .gornji-status p { color: #64748b; font-size: 14px; font-weight: 500; margin: 0; text-transform: uppercase; letter-spacing: 0.5px; }
        .online-bedz { display: inline-flex; align-items: center; justify-content: center; background-color: #e6f7ed; color: #10b981; font-weight: 700; padding: 4px 16px; border-radius: 9999px; font-size: 12px; margin-top: 8px; border: 1px solid #d1fae5; }
        .kartica { background-color: white; border: 2px solid #10b981; border-radius: 24px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 16px; position: relative; box-sizing: border-box; transition: all 0.3s ease; }
        .kartica.zauzeta { border-color: #fca5a5; }
        .status-bedz { position: absolute; top: 24px; right: 24px; padding: 4px 12px; font-size: 12px; font-weight: 700; border-radius: 9999px; }
        .status-slobodan { background-color: #e6f7ed; color: #10b981; border: 1px solid #d1fae5; }
        .status-zauzet { background-color: #fee2e2; color: #ef4444; border: 1px solid #fecaca; }
        .info-naziv { font-size: 20px; font-weight: 800; color: #1e293b; margin: 0 0 8px 0; padding-right: 60px; }
        .info-lokacija { font-size: 14px; color: #64748b; margin: 0 0 12px 0; font-weight: 500; display: flex; align-items: center; gap: 4px; }
        .info-snaga { display: inline-flex; align-items: center; padding: 4px 10px; font-size: 12px; font-weight: 700; background-color: #e6f7ed; color: #10b981; border: 1px solid #d1fae5; border-radius: 8px; }
        .korisnik-box { border: 1px solid #fecaca; border-radius: 16px; padding: 14px 16px; background-color: #fee2e2; display: flex; align-items: center; justify-content: space-between; }
        .profil-avatar { width: 44px; height: 44px; background-color: #fecaca; border-radius: 9999px; display: flex; align-items: center; justify-content: center; color: #ef4444; font-size: 20px; }
        .korisnik-ime-tekst { font-size: 18px; font-weight: 900; color: #1e293b; margin: 0; }
        .korisnik-status-tekst { font-size: 12px; color: #64748b; margin: 2px 0 0 0; font-weight: 500; }
        .dugme { width: 100%; padding: 14px; color: white; font-weight: 700; border-radius: 16px; border: none; font-size: 16px; cursor: pointer; transition: all 0.15s; font-family: inherit; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .dugme-zeleno { background-color: #10b981; margin-top: 20px; }
        .dugme-zeleno:hover { background-color: #059669; }
        .dugme-sivo { background-color: #6b7280; margin-top: 20px; }
        .dugme-sivo:hover { background-color: #4b5563; }
        .dugme-plavo { background-color: #3b82f6; }
        .dugme-plavo:hover { background-color: #2563eb; }
        .lista-kartica { background-color: white; border: 1px solid #f1f5f9; border-radius: 24px; padding: 20px; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05); margin-bottom: 20px; box-sizing: border-box; }
        .lista-zaglavlje { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .lista-naslov { font-size: 16px; font-weight: 800; color: #334155; margin: 0; display: flex; align-items: center; gap: 8px; }
        .lista-brojac { background-color: #eff6ff; color: #2563eb; font-weight: 900; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; font-size: 12px; border: 1px solid #dbeafe; }
        .lista-kontejner { margin-bottom: 16px; max-height: 160px; overflow-y: auto; }
        .prazan-red-tekst { text-align: center; color: #94a3b8; padding: 16px 0; font-size: 14px; font-weight: 500; margin: 0; }
        .hidden { display: none !important; }

        /* POPUP MODAL STILOVI (Identični kao sa tvoje slike) */
        .modal-prekrivač { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; box-sizing: border-box; padding: 16px; }
        .modal-telo { background-color: white; width: 100%; max-width: 400px; border-radius: 24px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); box-sizing: border-box; }
        .modal-naslov { font-size: 24px; font-weight: 800; color: #1e293b; margin: 0 0 20px 0; }
        .modal-labela { display: block; font-size: 14px; font-weight: 700; color: #475569; margin-bottom: 8px; }
        .modal-input { width: 100%; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; font-weight: 600; color: #334155; box-sizing: border-box; margin-bottom: 20px; }
        .modal-input:focus { outline: none; border-color: #10b981; }
        .slider-vrednost { text-align: center; font-size: 24px; font-weight: 900; color: #10b981; margin: 12px 0 24px 0; }
        .modal-dugmad-red { display: flex; gap: 12px; }
        .btn-otkaži { flex: 1; padding: 12px; background-color: #e2e8f0; color: #475569; font-weight: 700; border-radius: 12px; border: none; font-size: 16px; cursor: pointer; }
        .btn-potvrdi { flex: 1; padding: 12px; background-color: #10b981; color: white; font-weight: 700; border-radius: 12px; border: none; font-size: 16px; cursor: pointer; }
        
        /* Izgled klizača (Slidera) sa slike */
        .modal-slider { width: 100%; -webkit-appearance: none; height: 6px; background: #e2e8f0; border-radius: 9999px; outline: none; margin: 12px 0; }
        .modal-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #3b82f6; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Glavni kontejner aplikacije -->
    <div class="kontejner">
        
        <!-- Gornji Online Status -->
        <div class="gornji-status">
            <div class="online-bedz">✓ Online</div>
        </div>

        <!-- GLAVNA KARTICA PUNJAČA -->
        <div id="glavna-kartica" class="kartica">
          
          <!-- STATUS BADGE -->
          <div id="status-tekst" class="status-bedz status-slobodan">Slobodan</div>

          <!-- INFORMACIJE O PUNJAČU -->
          <div>
            <h2 class="info-naziv">EV Punjač Lidl Zemun</h2>
            <p class="info-lokacija">📍 Dunavskih virova 38, Zemun</p>
            <div class="info-snaga">🧃 20kW DC</div>
          </div>

          <!-- BOX SA IMENOM VOZAČA I TAJMEROM (Prikazuje se samo kad je zauzet) -->
          <div id="trenutni-korisnik-box" class="hidden" style="margin-top: 20px;">
              <div class="korisnik-box">
                  <div style="display: flex; align-items: center; gap: 12px;">
                      <div class="profil-avatar">👤</div>
                      <div>
                          <h4 id="prikaz-ime" class="korisnik-ime-tekst">-</h4>
                          <p class="korisnik-status-tekst">Trenutno puni</p>
                      </div>
                  </div>
                  <div style="text-align: right;">
                      <div id="prikaz-tajmer" style="font-size: 20px; font-weight: 900; color: #ef4444;">- min</div>
                      <p style="font-size: 10px; color: #64748b; font-weight: 700; margin: 0; text-transform: uppercase;">preostalo</p>
                  </div>
              </div>
          </div>

          <!-- GLAVNO DUGME KARTICE -->
          <button id="check-in-btn" class="dugme dugme-zeleno">Check-in</button>

        </div>

        <!-- LISTA ČEKANJA KARTICA -->
        <div class="lista-kartica">
            <div class="lista-zaglavlje">
                <h3 class="lista-naslov">📋 Lista čekanja</h3>
                <span id="queueCounter" class="lista-brojac">0</span>
            </div>
            
            <!-- Spisak ljudi u redu -->
            <div id="lista-ljudi" class="lista-kontejner">
                <p id="queueStatus" class="prazan-red-tekst">Nema ljudi u redu</p>
            </div>

            <!-- DUGME ZA PRIDRUŽIVANJE REDU -->
            <button id="red-dugme" class="dugme dugme-plavo">+ Pridruži se redu</button>
        </div>

    </div>

    <!-- ISKAČUĆI PROZOR (POPUP MODAL) - Skriven po defaultu -->
    <div id="checkin-modal" class="modal-prekrivač hidden">
        <div class="modal-telo">
            <h3 class="modal-naslov">Check-in</h3>
            
            <label class="modal-labela">Tvoje ime:</label>
            <input id="modal-ime-input" type="text" placeholder="Unesi ime..." class="modal-input">
            
            <label class="modal-labela">Koliko dugo? (minuta)</label>
            <input id="modal-vreme-slider" type="range" min="10" max="180" value="30" step="5" class="modal-slider">
            
            <div id="slider-prikaz-minuta" class="slider-vrednost">30 min</div>
            
            <div class="modal-dugmad-red">
                <button id="modal-otkaži-btn" class="btn-otkaži">Otkaži</button>
                <button id="modal-potvrdi-btn" class="btn-potvrdi">Potvrdi</button>
            </div>
        </div>
    </div>

    <!-- Internet veza sa Firebase bazom podataka -->
    <script type="module">
      import { initializeApp } from "https://gstatic.com";
      import { getDatabase, ref, set, onValue } from "https://gstatic.com";

      const firebaseConfig = {
          apiKey: "AIzaSyDi3jmhCordBvkXMLDf8",authDomain: "firebaseapp.com",databaseURL: "firebasedatabase.app",projectId: "lidl-punjac",storageBucket: "appspot.com",messagingSenderId: "97822670918",appId: "1:97822670918:web:3f4ea8083"};const app = initializeApp(firebaseConfig);const database = getDatabase(app);const statusRef = ref(database, 'punjac_zemun/status');// Elementi sa glavnog ekranaconst glavnaKartica = document.getElementById("glavna-kartica");const statusBadge = document.getElementById("status-tekst");const checkInBtn = document.getElementById("check-in-btn");const trenutniKorisnikBox = document.getElementById("trenutni-korisnik-box");const prikazIme = document.getElementById("prikaz-ime");const prikazTajmer = document.getElementById("prikaz-tajmer");// Elementi iz iskačućeg prozora (Modala)const checkinModal = document.getElementById("checkin-modal");const modalImeInput = document.getElementById("modal-ime-input");const modalVremeSlider = document.getElementById("modal-vreme-slider");const sliderPrikazMinuta = document.getElementById("slider-prikaz-minuta");const modalOtkažiBtn = document.getElementById("modal-otkaži-btn");const modalPotvrdiBtn = document.getElementById("modal-potvrdi-btn");let trenutnoZauzet = false;let intervalTajmera = null;// Slušanje pomeranja klizača (Slidera) u realnom vremenumodalVremeSlider.addEventListener('input', (e) => {sliderPrikazMinuta.innerText = e.target.value + " min";});// Slušanje stanja punjača iz Firebase bazeonValue(statusRef, (snapshot) => {const podaci = snapshot.val();clearInterval(intervalTajmera);if (podaci && podaci.stanje === 'zauzet') {trenutnoZauzet = true;statusBadge.innerText = "Zauzet";statusBadge.className = "status-bedz status-zauzet";glavnaKartica.className = "kartica kartica-zauzeta";trenutniKorisnikBox.classList.remove("hidden");prikazIme.innerText = podaci.koPuni;checkInBtn.innerText = "Check-out (Oslobodi punjač)";checkInBtn.className = "dugme dugme-sivo";// Logika za odbrojavanje preostalog vremenaconst vremePocetka = podaci.vremePocetka;const maksMinuta = parseInt(podaci.trajanjeMinuta || 30);function azurirajVreme() {const protekloSekundi = Math.floor((Date.now() - vremePocetka) / 1000);const protekloMinuta = Math.floor(protekloSekundi / 60);const preostaloMinuta = maksMinuta - protekloMinuta;if (preostaloMinuta <= 0) {prikazTajmer.innerText = "Isteklo!";clearInterval(intervalTajmera);} else {prikazTajmer.innerText = preostaloMinuta + " min";}}azurirajVreme();intervalTajmera = setInterval(azurirajVreme, 30000); // Osvežava na 30 sekundi} else {trenutnoZauzet = false;statusBadge.innerText = "Slobodan";statusBadge.className = "status-bedz status-slobodan";glavnaKartica.className = "kartica";trenutniKorisnikBox.classList.add("hidden");checkInBtn.innerText = "Check-in";checkInBtn.className = "dugme dugme-zeleno";}});// Klik na glavno dugme na karticicheckInBtn.addEventListener('click', () => {if (!trenutnoZauzet) {// Ako je slobodan, otvori iskačući prozor sa slikemodalImeInput.value = "";modalVremeSlider.value = "30";sliderPrikazMinuta.innerText = "30 min";checkinModal.classList.remove("hidden");} else {// Ako je zauzet, odmah oslobodi punjač (Check-out)set(statusRef, {stanje: 'slobodan',koPuni: ''});}});// Dugme "Otkaži" unutar iskačućeg prozoramodalOtkažiBtn.addEventListener('click', () => {checkinModal.classList.add("hidden");});// Dugme "Potvrdi" unutar iskačućeg prozora (Upisuje podatke u bazu)modalPotvrdiBtn.addEventListener('click', () => {const ime = modalImeInput.value.trim();const izabranoVreme = modalVremeSlider.value;if (!ime) {alert("Molimo te unesi svoje ime pre potvrde!");return;}// Šaljemo sve podatke u Firebaseset(statusRef, {stanje: 'zauzet',koPuni: ime,vremePocetka: Date.now(),trajanjeMinuta: izabranoVreme});// Zatvori prozorcheckinModal.classList.add("hidden");});
