<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Punjači - Lidl Zemun</title>
    <!-- Univerzalni Tailwind CSS v3 koji dokazano radi na tvom telefonu -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col items-center p-4">

    <!-- Glavni kontejner aplikacije -->
    <div class="w-full max-w-md mt-4">
        
        <!-- Gornji Online Status -->
        <div class="text-center mb-4">
            <div class="inline-flex items-center justify-center bg-emerald-50 text-emerald-600 font-semibold px-4 py-1 rounded-full text-xs mt-2 border border-emerald-100">
                ✓ Online
            </div>
        </div>

        <!-- GLAVNA KARTICA PUNJAČA -->
        <div class="bg-white border-2 border-emerald-500 rounded-3xl p-6 shadow-sm mb-4 relative transition-all duration-300">
          
          <!-- STATUS BADGE (Gore desno) -->
          <div id="status-tekst" class="absolute top-6 right-6 px-3 py-1 text-xs font-bold rounded-full bg-emerald-100 text-emerald-600 border border-emerald-200">
            Slobodan
          </div>

          <!-- INFORMACIJE O PUNJAČU -->
          <div class="space-y-2 mb-5">
            <h2 class="text-xl font-extrabold text-slate-800 pr-20">EV Punjač Lidl Zemun</h2>
            <p class="text-sm text-slate-500 flex items-center gap-1 font-medium">
              <span class="text-red-500">📍</span> Dunavskih virova 38, Zemun
            </p>
            <div class="inline-flex items-center px-2.5 py-0.5 rounded-lg text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-100">
              🔋 20kW DC
            </div>
          </div>

          <!-- Polje za unos imena iz Viber grupe (Samo kada je slobodan) -->
          <div id="ime-kontejner" class="mb-4">
              <label class="block text-xs font-bold text-slate-400 Scase-wider mb-1.5 uppercase tracking-wide">Ukucaj svoje ime iz Viber grupe:</label>
              <input id="korisnik-ime" type="text" placeholder="Npr. Goran, Nikola, Dejan..." 
                     class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 focus:outline-none focus:border-emerald-400 focus:bg-white transition">
          </div>

          <!-- KORISNIK BOX (Prikazuje se samo kada je ZAUZETO) -->
          <div id="trenutni-korisnik-box" class="hidden border border-rose-100 rounded-2xl p-4 bg-rose-50/40 flex items-center justify-between mb-4">
              <div class="flex items-center gap-3">
                  <div class="w-12 h-12 bg-rose-100 rounded-full flex items-center justify-center text-rose-500 text-xl font-bold shadow-inner">
                      👤
                  </div>
                  <div>
                      <h4 id="prikaz-ime" class="font-black text-slate-800 text-lg leading-tight">-</h4>
                      <p class="text-xs text-slate-500 font-medium mt-0.5">Trenutno puni</p>
                  </div>
              </div>
          </div>

          <!-- GLAVNO AKCIONO DUGME -->
          <div class="mt-5">
            <button id="check-in-btn" class="w-full py-3.5 text-white font-bold rounded-2xl bg-emerald-500 hover:bg-emerald-600 active:scale-[0.99] transition duration-150 shadow-md tracking-wide">
              Check-in
            </button>
          </div>

        </div>

        <!-- LISTA ČEKANJA KARTICA -->
        <div class="bg-white border border-slate-100 rounded-3xl p-5 shadow-sm mb-5">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center text-slate-700 font-extrabold text-base gap-2">
                    📋 Lista čekanja
                </div>
                <!-- Brojač ljudi u redu -->
                <span id="queueCounter" class="bg-blue-50 text-blue-600 font-black w-7 h-7 flex items-center justify-center rounded-full text-xs border border-blue-100">
                    0
                </span>
            </div>
            
            <!-- Spisak ljudi u redu -->
            <div id="lista-ljudi" class="space-y-2 mb-4 max-h-40 overflow-y-auto">
                <p id="queueStatus" class="text-center text-slate-400 py-4 text-sm font-medium">Nema ljudi u redu</p>
            </div>

            <!-- DUGME ZA DODAVANJE U LISTU ČEKANJA -->
            <button id="red-dugme" class="w-full py-3.5 text-white font-bold rounded-2xl bg-blue-500 hover:bg-blue-600 active:scale-[0.99] transition duration-150 shadow-md tracking-wide">
              + Pridruži se redu
            </button>
        </div>

    </div>

    <!-- Internet veza sa Firebase bazom podataka -->
    <script type="module">
      import { initializeApp } from "https://gstatic.com";
      import { getDatabase, ref, set, onValue, push, remove } from "https://gstatic.com";

      // Tvoja Firebase konfiguracija
      const firebaseConfig = {
        apiKey: "AIzaSyDi3jmhCordBvkXMLDf8",
        authDomain: "://firebaseapp.com",
        databaseURL: "https://firebasedatabase.app",
        projectId: "lidl-punjac",
        storageBucket: "://appspot.com",
        messagingSenderId: "97822670918",
        appId: "1:97822670918:web:3f4ea8083"
      };

      const app = initializeApp(firebaseConfig);
      const database = getDatabase(app);
      
      // Posebne grane u bazi samo za Zemun
      const statusRef = ref(database, 'punjac_zemun/status');
      const redRef = ref(database, 'punjac_zemun/red');

      // Selektovanje elemenata sa ekrana
      const statusBadge = document.getElementById("status-tekst");
      const checkInBtn = document.getElementById("check-in-btn");
      const redDugme = document.getElementById("red-dugme");
      const imeKontejner = document.getElementById("ime-kontejner");
      const korisnikImeInput = document.getElementById("korisnik-ime");
      const trenutniKorisnikBox = document.getElementById("trenutni-korisnik-box");
      const prikazIme = document.getElementById("prikaz-ime");
      const queueCounter = document.getElementById("queueCounter");
      const listaLjudiContainer = document.getElementById("lista-ljudi");

      let trenutnoZauzet = false;

      // 1. Logika koja uživo menja status na ekranu (Slobodan / Zauzet)
      onValue(statusRef, (snapshot) => {
        const podaci = snapshot.val();
        
        if (podaci && podaci.stanje === 'zauzet') {
          trenutnoZauzet = true;
          
          statusBadge.innerText = "Zauzet";
          statusBadge.className = "absolute top-6 right-6 px-3 py-1 text-xs font-bold rounded-full bg-red-100 text-red-600 border border-red-200";
          
          imeKontejner.classList.add("hidden");
          trenutniKorisnikBox.classList.remove("hidden");
          prikazIme.innerText = podaci.koPuni;
          
          checkInBtn.innerText = "Check-out (Oslobodi punjač)";
          checkInBtn.className = "w-full py-3.5 text-white font-bold rounded-2xl bg-gray-500 hover:bg-gray-600 transition duration-150 shadow-md tracking-wide";
        } else {
          trenutnoZauzet = false;
          
          statusBadge.innerText = "Slobodan";
          statusBadge.className = "absolute top-6 right-6 px-3 py-1 text-xs font-bold rounded-full bg-emerald-100 text-emerald-600 border border-emerald-200";
          
          imeKontejner.classList.remove("hidden");
          trenutniKorisnikBox.classList.add("hidden");
          
          checkInBtn.innerText = "Check-in";
          checkInBtn.className = "w-full py-3.5 text-white font-bold rounded-2xl bg-emerald-500 hover:bg-emerald-600 transition duration-150 shadow-md tracking-wide";
        }
      });

      // 2. Logika koja uživo osvežava Listu čekanja na dnu ekrana
      onValue(redRef, (snapshot) => {
        listaLjudiContainer.innerHTML = "";
        let listaCekanjaLokalno = [];
        const podaci = snapshot.val();

        if (podaci) {
            Object.keys(podaci).forEach(kljuc => {
                listaCekanjaLokalno.push({
                    id: kljuc,
                    ime: podaci[kljuc].ime,
                    vreme: podaci[kljuc].vreme
                });
            });

            // Sortiranje vozača po vremenu prijave
            listaCekanjaLokalno.sort((a, b) => a.vreme - b.vreme);
            queueCounter.innerText = listaCekanjaLokalno.length;
            
            listaCekanjaLokalno.forEach((korisnik, indeks) => {
                const osobaRow = document.createElement("div");
                osobaRow.className = "flex justify-between items-center bg-gray-50 border border-gray-100 p-2.5 rounded-xl text-sm font-bold text-gray-700 mt-2 shadow-sm";
                osobaRow.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-blue-500">${indeks + 1}.</span>
                        <span>👤 ${korisnik.ime}</span>
                    </div>
                    <button class="text-xs text-red-500 font-semibold hover:underline" data-id="${korisnik.id}">Ukloni</button>
                `;
                listaLjudiContainer.appendChild(osobaRow);
            });

            // Brisanje iz liste čekanja na dugme "Ukloni"
            listaLjudiContainer.querySelectorAll("button").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    const idZaBrisanje = e.target.getAttribute("data-id");
                    remove(ref(database, `punjac_zemun/red/${idZaBrisanje}`));
                });
            });

        } else {
            queueCounter.innerText = "0";
            listaLjudiContainer.innerHTML = '<p id="queueStatus" class="text-center text-slate-400 py-4 text-sm font-medium">Nema ljudi u redu</p>';
        }
      });

// 3. Akcija na klik za dugme "Check-in / Check-out"
checkInBtn.addEventListener('click', () => {
const unesenoIme = korisnikImeInput.value.trim();
if (!trenutnoZauzet) {
if (!unesenoIme) {
alert("Molimo te ukucaj svoje ime iz Viber grupe pre nego što pritisneš Check-in!");
return;
}
set(statusRef, {
stanje: 'zauzet',
koPuni: unesenoIme,
vremePocetka: Date.now()
});
korisnikImeInput.value = "";
} else {
set(statusRef, {
stanje: 'slobodan',
koPuni: ''
});
}
});
// 4. Akcija na klik za plavo dugme "+ Pridruži se redu"
redDugme.addEventListener('click', () => {
const imeZaRed = prompt("Ukucaj svoje ime iz Viber grupe da staneš u red:");
if (imeZaRed && imeZaRed.trim() !== "") {
push(redRef, {
ime: imeZaRed.trim(),
vreme: Date.now()
});
}
});
