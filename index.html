<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Punjač Lidl Zemun</title>
    <!-- Pouzdan i zvaničan Tailwind CSS koji provereno radi na tvom sajtu -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col items-center p-4">

    <!-- Glavni kontejner aplikacije -->
    <div class="w-full max-w-md mt-4">
        
        <!-- Gornji Online Status -->
        <div class="text-center mb-4">
            <div class="inline-flex items-center justify-center bg-emerald-50 text-emerald-600 font-semibold px-4 py-1 rounded-full text-xs mt-2 border border-emerald-100">
                ✓ Online
            </div>
        </div>

        <!-- GLAVNA KARTICA PUNJAČA -->
        <div id="glavna-kartica" class="bg-white border-2 border-emerald-500 rounded-3xl p-6 shadow-sm mb-4 relative transition-all duration-300">
          
          <!-- STATUS BADGE (Gore desno) -->
          <div id="status-tekst" class="absolute top-6 right-6 px-3 py-1 text-xs font-bold rounded-full bg-emerald-100 text-emerald-600 border border-emerald-200">
            Slobodan
          </div>

          <!-- INFORMACIJE O PUNJAČU -->
          <div class="space-y-2 mb-5">
            <h2 class="text-xl font-extrabold text-slate-800 pr-20">EV Punjač Lidl Zemun</h2>
            <p class="text-sm text-slate-500 flex items-center gap-1 font-medium">
              <span class="text-red-500">📍</span> Dunavskih virova 38, Zemun
            </p>
            <div class="inline-flex items-center px-2.5 py-0.5 rounded-lg text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-100">
              🔋 20kW DC
            </div>
          </div>

          <!-- BOX SA IMENOM VOZAČA I TAJMEROM (Prikazuje se samo kada je ZAUZETO) -->
          <div id="trenutni-korisnik-box" class="hidden border border-rose-100 rounded-2xl p-4 bg-rose-50/40 flex items-center justify-between mb-4">
              <div class="flex items-center gap-3">
                  <div class="w-12 h-12 bg-rose-100 rounded-full flex items-center justify-center text-rose-500 text-xl font-bold shadow-inner">
                      👤
                  </div>
                  <div>
                      <h4 id="prikaz-ime" class="font-black text-slate-800 text-lg leading-tight">-</h4>
                      <p class="text-xs text-slate-500 font-medium mt-0.5">Trenutno puni</p>
                  </div>
              </div>
              <div class="text-right">
                  <div id="prikaz-tajmer" class="text-xl font-black text-red-500 tracking-tight">- min</div>
                  <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">preostalo</p>
              </div>
          </div>

          <!-- GLAVNO DUGME -->
          <div class="mt-5">
            <button id="check-in-btn" class="w-full py-3.5 text-white font-bold rounded-2xl bg-emerald-500 hover:bg-emerald-600 active:scale-[0.99] transition duration-150 shadow-md tracking-wide">
              Check-in
            </button>
          </div>

        </div>

        <!-- LISTA ČEKANJA KARTICA -->
        <div class="bg-white border border-slate-100 rounded-3xl p-5 shadow-sm mb-5">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center text-slate-700 font-extrabold text-base gap-2">
                    📋 Lista čekanja
                </div>
                <span id="queueCounter" class="bg-blue-50 text-blue-600 font-black w-7 h-7 flex items-center justify-center rounded-full text-xs border border-blue-100">
                    0
                </span>
            </div>
            
            <div id="lista-ljudi" class="space-y-2 mb-4 max-h-40 overflow-y-auto">
                <p id="queueStatus" class="text-center text-slate-400 py-4 text-sm font-medium">Nema ljudi u redu</p>
            </div>

            <button id="red-dugme" class="w-full py-3.5 text-white font-bold rounded-2xl bg-blue-500 hover:bg-blue-600 active:scale-[0.99] transition duration-150 shadow-md tracking-wide">
              + Pridruži se redu
            </button>
        </div>

    </div>

    <!-- ISKAČUĆI PROZOR (POPUP MODAL) -->
    <div id="checkin-modal" class="fixed inset-0 bg-slate-900 bg-opacity-40 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-xl transform transition-all">
            <h3 class="text-2xl font-extrabold text-slate-800 mb-5">Check-in</h3>
            
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Tvoje ime:</label>
            <input id="modal-ime-input" type="text" placeholder="Unesi ime..." class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 focus:outline-none focus:border-emerald-400 focus:bg-white transition mb-5">
            
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Koliko dugo? (minuta)</label>
            <input id="modal-vreme-slider" type="range" min="10" max="180" value="30" step="5" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-500 my-4">
            
            <div id="slider-prikaz-minuta" class="text-center text-2xl font-black text-emerald-500 mb-6">30 min</div>
            
            <div class="flex gap-3">
                <button id="modal-otkaz-btn" class="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl text-sm hover:bg-slate-200 transition">Otkaži</button>
                <button id="modal-potvrdi-btn" class="flex-1 py-3 bg-emerald-500 text-white font-bold rounded-xl text-sm hover:bg-emerald-600 transition">Potvrdi</button>
            </div>
        </div>
    </div>

    <!-- Kompletan Firebase JavaScript u jednom tagu -->
    <script type="module">
      import { initializeApp } from "https://gstatic.com";
      import { getDatabase, ref, set, onValue, push, remove } from "https://gstatic.com";

      const firebaseConfig = {
        apiKey: "AIzaSyDi3jmhCordBvkXMLDf8",
        authDomain: "://firebaseapp.com",
        databaseURL: "https://firebasedatabase.app",
        projectId: "lidl-punjac",
        storageBucket: "://appspot.com",
        messagingSenderId: "97822670918",
        appId: "1:97822670918:web:3f4ea8083"
      };

      const app = initializeApp(firebaseConfig);
      const database = getDatabase(app);
      
      const statusRef = ref(database, 'punjac_zemun/status');
      const redRef = ref(database, 'punjac_zemun/red');

      const glavnaKartica = document.getElementById("glavna-kartica");
      const statusBadge = document.getElementById("status-tekst");
      const checkInBtn = document.getElementById("check-in-btn");
      const redDugme = document.getElementById("red-dugme");
      const trenutniKorisnikBox = document.getElementById("trenutni-korisnik-box");
      const prikazIme = document.getElementById("prikaz-ime");
      const prikazTajmer = document.getElementById("prikaz-tajmer");
      const queueCounter = document.getElementById("queueCounter");
      const listaLjudiContainer = document.getElementById("lista-ljudi");

      const checkinModal = document.getElementById("checkin-modal");
      const modalImeInput = document.getElementById("modal-ime-input");
      const modalVremeSlider = document.getElementById("modal-vreme-slider");
      const sliderPrikazMinuta = document.getElementById("slider-prikaz-minuta");
      const modalOtkazBtn = document.getElementById("modal-otkaz-btn");
      const modalPotvrdiBtn = document.getElementById("modal-potvrdi-btn");

      let trenutnoZauzet = false;
      let intervalTajmera = null;

      modalVremeSlider.addEventListener('input', (e) => {
          sliderPrikazMinuta.innerText = e.target.value + " min";
      });

      // 1. Slušanje stanja punjača uživo
      onValue(statusRef, (snapshot) => {
        const podaci = snapshot.val();
        clearInterval(intervalTajmera);
        
        if (podaci && podaci.stanje === 'zauzet') {
          trenutnoZauzet = true;
          statusBadge.innerText = "Zauzet";
          statusBadge.className = "absolute top-6 right-6 px-3 py-1 text-xs font-bold rounded-full bg-red-100 text-red-600 border border-red-200";
          glavnaKartica.className = "bg-white border-2 border-red-400 rounded-3xl p-6 shadow-sm mb-4 relative transition-all duration-300";
          trenutniKorisnikBox.classList.remove("hidden");
          prikazIme.innerText = podaci.koPuni;
          checkInBtn.innerText = "Check-out (Oslobodi punjač)";
          checkInBtn.className = "w-full py-3.5 text-white font-bold rounded-2xl bg-gray-500 hover:bg-gray-600 transition duration-150 shadow-md tracking-wide";

          const vremePocetka = podaci.vremePocetka;
          const maksMinuta = parseInt(podaci.trajanjeMinuta || 30);

          function azurirajVreme() {
              const protekloSekundi = Math.floor((Date.now() - vremePocetka) / 1000);
              const protekloMinuta = Math.floor(protekloSekundi / 60);
              const preostaloMinuta = maksMinuta - protekloMinuta;

              if (preostaloMinuta <= 0) {
                  prikazTajmer.innerText = "Isteklo!";
                  clearInterval(intervalTajmera);
              } else {
                  prikazTajmer.innerText = preostaloMinuta + " min";
              }
          }
          azurirajVreme();
          intervalTajmera = setInterval(azurirajVreme, 30000);
        } else {
          trenutnoZauzet = false;
          statusBadge.innerText = "Slobodan";
            statusBadge.className = "absolute top-6 right-6 px-3 py-1 text-xs font-bold rounded-full bg-emerald-100 text-emerald-600 border border-emerald-200";glavnaKartica.className = "bg-white border-2 border-emerald-500 rounded-3xl p-6 shadow-sm mb-4 relative transition-all duration-300";trenutniKorisnikBox.classList.add("hidden");checkInBtn.innerText = "Check-in";checkInBtn.className = "w-full py-3.5 text-white font-bold rounded-2xl bg-emerald-500 hover:bg-emerald-600 transition duration-150 shadow-md tracking-wide";}});// 2. Slušanje liste čekanja uživoonValue(redRef, (snapshot) => {listaLjudiContainer.innerHTML = "";let listaCekanjaLokalno = [];const podaci = snapshot.val();if (podaci) {Object.keys(podaci).forEach(kljuc => {listaCekanjaLokalno.push({ id: kljuc, ime: podaci[kljuc].ime, vreme: podaci[kljuc].vreme });});listaCekanjaLokalno.sort((a, b) => a.vreme - b.vreme);queueCounter.innerText = listaCekanjaLokalno.length;listaCekanjaLokalno.forEach((korisnik, indeks) => {const osobaRow = document.createElement("div");osobaRow.className = "flex justify-between items-center bg-gray-50 border border-gray-100 p-2.5 rounded-xl text-sm font-bold text-gray-700 mt-2 shadow-sm";osobaRow.innerHTML = <div class="flex items-center gap-2"> <span class="text-blue-500">${indeks + 1}.</span> <span>👤 ${korisnik.ime}</span> </div> <button class="text-xs text-red-500 font-semibold hover:underline" data-id="${korisnik.id}">Ukloni</button>;listaLjudiContainer.appendChild(osobaRow);});listaLjudiContainer.querySelectorAll("button").forEach(btn => {btn.addEventListener("click", (e) => {const idZaBrisanje = e.target.getAttribute("data-id");remove(ref(database, punjac_zemun/red/${idZaBrisanje}));});});} else {queueCounter.innerText = "0";listaLjudiContainer.innerHTML = 'Nema ljudi u redu';}});// Klik na glavno dugmecheckInBtn.addEventListener('click', () => {if (!trenutnoZauzet) {modalImeInput.value = "";modalVremeSlider.value = "30";sliderPrikazMinuta.innerText = "30 min";checkinModal.classList.remove("hidden");} else {set(statusRef, { stanje: 'slobodan', koPuni: '' });}});modalOtkazBtn.addEventListener('click', () => { checkinModal.classList.add("hidden"); });modalPotvrdiBtn.addEventListener('click', () => {const ime = modalImeInput.value.trim();const izabranoVreme = modalVremeSlider.value;if (!ime) { alert("Molimo te unesi svoje ime!"); return; }set(statusRef, {stanje: 'zauzet',koPuni: ime,vremePocetka: Date.now(),trajanjeMinuta: izabranoVreme});checkinModal.classList.add("hidden");});// Klik na plavo dugme "+ Pridruži se redu"redDugme.addEventListener('click', () => {const imeZaRed = prompt("Ukucaj svoje ime iz Viber grupe da staneš u red:");if (imeZaRed && imeZaRed.trim() !== "") {push(redRef, { ime: imeZaRed.trim(), vreme: Date.now() });}});
