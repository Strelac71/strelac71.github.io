<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Punjač Lidl Zemun</title>
    <!-- Klasični CSS stilovi upisani direktno da dizajn nikada više ne pukne -->
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .kontejner { w-full; max-w: 448px; width: 100%; margin-top: 16px; box-sizing: border-box; }
        .naslov-sekcija { text-align: center; margin-bottom: 24px; }
        .naslov { font-size: 30px; font-weight: 800; color: #1e293b; margin: 0; }
        .podnaslov { color: #64748b; font-size: 16px; font-weight: 500; margin: 4px 0 0 0; }
        .online-bedz { inline-flex; align-items: center; justify-content: center; background-color: #d1fae5; color: #065f46; font-weight: 600; padding: 4px 16px; rounded-radius: 9999px; border-radius: 9999px; font-size: 12px; margin-top: 12px; border: 1px solid #a7f3d0; }
        .kartica { background-color: white; border: 2px solid #10b981; border-radius: 24px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 16px; position: relative; box-sizing: border-box; }
        .kartica-zauzeta { border-color: #fca5a5; }
        .status-bedz { position: absolute; top: 24px; right: 24px; padding: 4px 12px; font-size: 12px; font-weight: 700; border-radius: 9999px; }
        .status-slobodan { background-color: #d1fae5; color: #047857; border: 1px solid #a7f3d0; }
        .status-zauzet { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .info-naziv { font-size: 20px; font-weight: 900; color: #1e293b; margin: 0 pr-20; padding-right: 60px; }
        .info-lokacija { font-size: 14px; color: #64748b; margin: 8px 0; font-weight: 500; }
        .info-snaga { display: inline-block; padding: 2px 10px; font-size: 12px; font-weight: 700; background-color: #ecfdf5; color: #047857; border: 1px solid #d1fae5; border-radius: 8px; }
        .labela { display: block; font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; margin-top: 16px; }
        .input-polje { width: 100%; padding: 10px 16px; bg-color: #f8fafc; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; font-weight: 600; color: #334155; box-sizing: border-box; }
        .input-polje:focus { outline: none; border-color: #10b981; background-color: white; }
        .korisnik-box { border: 1px solid #fee2e2; border-radius: 16px; padding: 16px; background-color: #fff5f5; display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
        .profil-avatar { w-12; h-12; width: 48px; height: 48px; background-color: #fee2e2; border-radius: 9999px; display: flex; align-items: center; justify-content: center; color: #ef4444; font-size: 20px; box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.06); }
        .korisnik-ime-tekst { font-size: 18px; font-weight: 900; color: #1e293b; margin: 0; }
        .korisnik-status-tekst { font-size: 12px; color: #64748b; margin: 2px 0 0 0; font-weight: 500; }
        .dugme { width: 100%; padding: 14px; color: white; font-weight: 700; border-radius: 16px; border: none; font-size: 16px; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-top: 20px; transition: background-color 0.15s; }
        .dugme-zeleno { background-color: #10b981; }
        .dugme-zeleno:hover { background-color: #059669; }
        .dugme-sivo { background-color: #6b7280; }
        .dugme-sivo:hover { background-color: #4b5563; }
        .dugme-plavo { background-color: #3b82f6; margin-top: 0; }
        .dugme-plavo:hover { background-color: #2563eb; }
        .lista-kartica { background-color: white; border: 1px solid #e2e8f0; border-radius: 24px; padding: 20px; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05); margin-bottom: 20px; box-sizing: border-box; }
        .lista-zaglavlje { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .lista-naslov { font-size: 16px; font-weight: 800; color: #334155; margin: 0; display: flex; align-items: center; gap: 8px; }
        .lista-brojac { background-color: #eff6ff; color: #2563eb; font-weight: 900; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; font-size: 12px; border: 1px solid #dbeafe; }
        .lista-kontejner { margin-bottom: 20px; max-height: 160px; overflow-y: auto; }
        .prazan-red-tekst { text-align: center; color: #94a3b8; padding: 16px 0; font-size: 14px; font-weight: 500; margin: 0; }
        .red-red { display: flex; justify-content: space-between; align-items: center; background-color: #f8fafc; border: 1px solid #f1f5f9; padding: 10px; border-radius: 12px; font-size: 14px; font-weight: 700; color: #475569; margin-top: 8px; }
        .obrisi-btn { background: none; border: none; color: #ef4444; font-size: 12px; font-weight: 600; cursor: pointer; }
        .obrisi-btn:hover { text-decoration: underline; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Glavni kontejner aplikacije -->
    <div class="kontejner">
        
        <!-- Gornji Naslov i Online Status -->
        <div class="naslov-sekcija">
            <h1 class="naslov">⚡ EV Punjači</h1>
            <p class="podnaslov">Lidl Zemun</p>
            <div class="online-bedz">✓ Online</div>
        </div>

        <!-- GLAVNA KARTICA PUNJAČA -->
        <div id="glavna-kartica" class="kartica">
          
          <!-- STATUS BADGE (Gore desno) -->
          <div id="status-tekst" class="status-bedz status-slobodan">Slobodan</div>

          <!-- INFORMACIJE O PUNJAČU -->
          <div>
            <h2 class="info-naziv">EV Punjač Lidl Zemun</h2>
            <p class="info-lokacija">📍 Dunavskih virova 38, Zemun</p>
            <div class="info-snaga">🔋 20kW DC</div>
          </div>

          <!-- Polje za unos imena -->
          <div id="ime-kontejner">
              <label class="labela">Ukucaj svoje ime iz Viber grupe:</label>
              <input id="korisnik-ime" type="text" placeholder="Npr. Goran, Nikola, Dejan..." class="input-polje">
          </div>

          <!-- BOX SA IMENOM VOZAČA (Sakriven po defaultu) -->
          <div id="trenutni-korisnik-box" class="hidden">
              <div class="korisnik-box">
                  <div style="display: flex; align-items: center; gap: 12px;">
                      <div class="profil-avatar">👤</div>
                      <div>
                          <h4 id="prikaz-ime" class="korisnik-ime-tekst">-</h4>
                          <p class="korisnik-status-tekst">Trenutno puni</p>
                      </div>
                  </div>
              </div>
          </div>

          <!-- GLAVNO DUGME KARTICE -->
          <button id="check-in-btn" class="dugme dugme-zeleno">Check-in</button>

        </div>

        <!-- LISTA ČEKANJA KARTICA -->
        <div class="lista-kartica">
            <div class="lista-zaglavlje">
                <h3 class="lista-naslov">📋 Lista čekanja</h3>
                <span id="queueCounter" class="lista-brojac">0</span>
            </div>
            
            <!-- Spisak ljudi u redu -->
            <div id="lista-ljudi" class="lista-kontejner">
                <p id="queueStatus" class="prazan-red-tekst">Nema ljudi u redu</p>
            </div>

            <!-- DUGME ZA PRIDRUŽIVANJE REDU -->
            <button id="red-dugme" class="dugme dugme-plavo">+ Pridruži se redu</button>
        </div>

    </div>

    <!-- Internet veza sa tvojom Firebase bazom -->
    <script type="module">
      import { initializeApp } from "https://gstatic.com";
      import { getDatabase, ref, set, onValue, push, remove } from "https://gstatic.com";

      const firebaseConfig = {
        apiKey: "AIzaSyDi3jmhCordBvkXMLDf8",
        authDomain: "://firebaseapp.com",
        databaseURL: "https://firebasedatabase.app",
        projectId: "lidl-punjac",
        storageBucket: "://appspot.com",
        messagingSenderId: "97822670918",
        appId: "1:97822670918:web:3f4ea8083"
      };

      const app = initializeApp(firebaseConfig);
      const database = getDatabase(app);
      
      const statusRef = ref(database, 'punjac_zemun/status');
      const redRef = ref(database, 'punjac_zemun/red');

      const glavnaKartica = document.getElementById("glavna-kartica");
      const statusBadge = document.getElementById("status-tekst");
      const checkInBtn = document.getElementById("check-in-btn");
      const redDugme = document.getElementById("red-dugme");
      const imeKontejner = document.getElementById("ime-kontejner");
      const korisnikImeInput = document.getElementById("korisnik-ime");
      const trenutniKorisnikBox = document.getElementById("trenutni-korisnik-box");
      const prikazIme = document.getElementById("prikaz-ime");
      const queueCounter = document.getElementById("queueCounter");
      const listaLjudiContainer = document.getElementById("lista-ljudi");

      let trenutnoZauzet = false;

      // 1. Uživo slušanje promena slobodan / zauzet
      onValue(statusRef, (snapshot) => {
        const podaci = snapshot.val();
        
        if (podaci && podaci.stanje === 'zauzet') {
          trenutnoZauzet = true;
          
          statusBadge.innerText = "Zauzet";
          statusBadge.className = "status-bedz status-zauzet";
          glavnaKartica.className = "kartica kartica-zauzeta";
          
          imeKontejner.classList.add("hidden");
          trenutniKorisnikBox.classList.remove("hidden");
          prikazIme.innerText = podaci.koPuni;
           checkInBtn.innerText = "Check-out (Oslobodi punjač)";checkInBtn.className = "dugme dugme-sivo";} else {trenutnoZauzet = false;statusBadge.innerText = "Slobodan";statusBadge.className = "status-bedz status-slobodan";glavnaKartica.className = "kartica";imeKontejner.classList.remove("hidden");trenutniKorisnikBox.classList.add("hidden");checkInBtn.innerText = "Check-in";checkInBtn.className = "dugme dugme-zeleno";}});// 2. Uživo osvežavanje Liste čekanja na dnuonValue(redRef, (snapshot) => {listaLjudiContainer.innerHTML = "";let listaCekanjaLokalno = [];const podaci = snapshot.val();if (podaci) {Object.keys(podaci).forEach(kljuc => {listaCekanjaLokalno.push({id: kljuc,ime: podaci[kljuc].ime,vreme: podaci[kljuc].vreme});});listaCekanjaLokalno.sort((a, b) => a.vreme - b.vreme);queueCounter.innerText = listaCekanjaLokalno.length;listaCekanjaLokalno.forEach((korisnik, indeks) => {const osobaRow = document.createElement("div");osobaRow.className = "red-red";osobaRow.innerHTML = <div style="display: flex; align-items: center; gap: 8px;"> <span style="color: #2563eb;">${indeks + 1}.</span> <span>👤 ${korisnik.ime}</span> </div> <button class="obrisi-btn" data-id="${korisnik.id}">Ukloni</button>;listaLjudiContainer.appendChild(osobaRow);});listaLjudiContainer.querySelectorAll(".obrisi-btn").forEach(btn => {btn.addEventListener("click", (e) => {const idZaBrisanje = e.target.getAttribute("data-id");remove(ref(database, punjac_zemun/red/${idZaBrisanje}));});});} else {queueCounter.innerText = "0";listaLjudiContainer.innerHTML = 'Nema ljudi u redu';}});// 3. Klik na Check-in / Check-out dugmecheckInBtn.addEventListener('click', () => {const unesenoIme = korisnikImeInput.value.trim();if (!trenutnoZauzet) {if (!unesenoIme) {alert("Ukucaj svoje ime iz Viber grupe pre nego što pritisneš Check-in!");return;}set(statusRef, {stanje: 'zauzet',koPuni: unesenoIme,vremePocetka: Date.now()});korisnikImeInput.value = "";} else {set(statusRef, {stanje: 'slobodan',koPuni: ''});}});// 4. Klik na plavo dugme "+ Pridruži se redu"redDugme.addEventListener('click', () => {const imeZaRed = prompt("Ukucaj svoje ime iz Viber grupe da staneš u red čekanja:");if (imeZaRed && imeZaRed.trim() !== "") {push(redRef, {ime: imeZaRed.trim(),vreme: Date.now()});}});
